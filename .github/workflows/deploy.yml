name: deploy

# Rebuilds https://conf.fyi: the conf-tracker Amplify app clones this repo's main and builds the
# static site. Runs on pushes to main (a merged PR) and daily, so "upcoming" and "CFP open" in the
# static pages stay current. Keep it to these two triggers: no manual, API-dispatched, reusable or
# PR triggers. The AWS role trusts only this repo's refs/heads/main and can only start that build.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Start the Amplify build
        run: |
          aws amplify start-job --app-id d2hd98wdirltug --branch-name main --job-type RELEASE \
            --query 'jobSummary.[jobId,status]' --output text
